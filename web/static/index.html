<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Rubik AI Web Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --border: rgba(255, 255, 255, 0.1);
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      font-family: 'Inter', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Glassmorphism UI */
    #control-panel {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 340px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn {
      background: var(--border);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary-hover);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    select {
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
    }

    select option {
      background: var(--bg-dark);
    }

    .num-input {
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      width: 60px;
      text-align: center;
    }

    .stats {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
    }

    .stat-val {
      font-weight: 600;
      color: #fff;
    }

    #status-banner {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 20;
      min-width: 280px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-left-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="canvas-container"></div>

  <div id="status-banner" style="display: none;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div id="spinner-container" style="display: none;">
          <div class="spinner"></div>
        </div>
        <div id="status-text" style="font-weight: 600; letter-spacing: 1px; font-size: 14px;">AI ĐANG TÍNH TOÁN LỜI
          GIẢI...</div>
      </div>
      <div id="progress-container"
        style="display: none; width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px;">
        <div id="progress-bar"
          style="width: 0%; height: 100%; background: var(--primary); transition: width 0.2s ease-out;"></div>
      </div>
    </div>
  </div>

  <div id="control-panel">
    <h1>Rubik AI Solver</h1>

    <div style="display:flex; justify-content: space-between; align-items: center;">
      <label for="inp-scramble-moves" style="font-size: 13px; font-weight: 600;">Số bước xáo trộn:</label>
      <input type="number" id="inp-scramble-moves" min="1" max="30" class="num-input">
    </div>

    <div style="display:flex; gap: 10px;">
      <button class="btn" id="btn-scramble" style="flex:1;">🔀 Xáo trộn</button>
    </div>

    <select id="sel-heuristic">
      <option value="v2">Heuristic v2 (Pattern DB) ⚡</option>
      <option value="v1">Heuristic v1 (Thô - Chậm)</option>
    </select>
    
    <div id="warn-heuristic" style="display:none; color: #fbbf24; font-size: 12px; line-height: 1.4;">
      ⚠️ Heuristic thô có thể timeout với scramble dài (>8 bước) — thử heuristic v2 hoặc giảm số bước.
    </div>

    <button class="btn btn-primary" id="btn-solve">✨ Giải Rubik</button>

    <div class="stats">
      <div class="stat-row"><span>Độ dài:</span> <span class="stat-val" id="stat-len">-</span></div>
      <div class="stat-row"><span>Node mở:</span> <span class="stat-val" id="stat-node">-</span></div>
      <div class="stat-row"><span>Thời gian:</span> <span class="stat-val" id="stat-time">-</span></div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- BẢN ĐỒ MÀU VÀ TOẠ ĐỘ ---
    const COLORS = {
      R: 0xb71234, // Đỏ (Right) x+
      L: 0xff5800, // Cam (Left) x-
      U: 0xffffff, // Trắng (Up) y+
      D: 0xffd500, // Vàng (Down) y-
      F: 0x009b48, // Xanh lá (Front) z+
      B: 0x0046ad, // Xanh dương (Back) z-
      I: 0x111111  // Đen (Inner)
    };

    // move string -> trục, hướng xoay, toạ độ mặt
    const MOVE_MAP = {
      "U": { axis: 'y', dir: -1, layer: 'ly', val: 1 },
      "U'": { axis: 'y', dir: 1, layer: 'ly', val: 1 },
      "U2": { axis: 'y', dir: -2, layer: 'ly', val: 1 },
      "D": { axis: 'y', dir: 1, layer: 'ly', val: -1 },
      "D'": { axis: 'y', dir: -1, layer: 'ly', val: -1 },
      "D2": { axis: 'y', dir: 2, layer: 'ly', val: -1 },
      "R": { axis: 'x', dir: -1, layer: 'lx', val: 1 },
      "R'": { axis: 'x', dir: 1, layer: 'lx', val: 1 },
      "R2": { axis: 'x', dir: -2, layer: 'lx', val: 1 },
      "L": { axis: 'x', dir: 1, layer: 'lx', val: -1 },
      "L'": { axis: 'x', dir: -1, layer: 'lx', val: -1 },
      "L2": { axis: 'x', dir: 2, layer: 'lx', val: -1 },
      "F": { axis: 'z', dir: -1, layer: 'lz', val: 1 },
      "F'": { axis: 'z', dir: 1, layer: 'lz', val: 1 },
      "F2": { axis: 'z', dir: -2, layer: 'lz', val: 1 },
      "B": { axis: 'z', dir: 1, layer: 'lz', val: -1 },
      "B'": { axis: 'z', dir: -1, layer: 'lz', val: -1 },
      "B2": { axis: 'z', dir: 2, layer: 'lz', val: -1 }
    };

    // --- SETUP SCENE ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0f172a, 10, 30);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5, 5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Ánh sáng
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // --- TẠO 27 KHỐI (CUBIES) ---
    const cubies = [];
    const spacing = 1.05;
    const geometry = new THREE.BoxGeometry(1, 1, 1);

    function createMaterial(color) {
      return new THREE.MeshPhongMaterial({ color: color, shininess: 60, rounded: true });
    }

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const mats = [
            createMaterial(x === 1 ? COLORS.R : COLORS.I), // 0: x+
            createMaterial(x === -1 ? COLORS.L : COLORS.I),// 1: x-
            createMaterial(y === 1 ? COLORS.U : COLORS.I), // 2: y+
            createMaterial(y === -1 ? COLORS.D : COLORS.I),// 3: y-
            createMaterial(z === 1 ? COLORS.F : COLORS.I), // 4: z+
            createMaterial(z === -1 ? COLORS.B : COLORS.I),// 5: z-
          ];
          const mesh = new THREE.Mesh(geometry, mats);

          // Vẽ viền đen cho khối (giống khối rubik thực)
          const edges = new THREE.EdgesGeometry(geometry);
          const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
          mesh.add(line);

          mesh.position.set(x * spacing, y * spacing, z * spacing);

          // Lưu thuộc tính toạ độ ảo (logic coord) để dễ xoay
          mesh.userData = { lx: x, ly: y, lz: z };

          scene.add(mesh);
          cubies.push(mesh);
        }
      }
    }

    console.log("Cube added:", scene.children.length);

    // --- LOGIC ANIMATION XOAY MẶT ---

    // Easing cực êm
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    function animateMoveAsync(moveStr, durationMs) {
      return new Promise(resolve => {
        const cfg = MOVE_MAP[moveStr];
        if (!cfg) return resolve();

        // Gom 9 viên thuộc layer
        const targetCubies = cubies.filter(c => Math.round(c.userData[cfg.layer]) === cfg.val);
        if (targetCubies.length === 0) return resolve();

        const pivot = new THREE.Group();
        scene.add(pivot);

        targetCubies.forEach(c => {
          c.updateMatrixWorld();
          THREE.SceneUtils && THREE.SceneUtils.attach ?
            THREE.SceneUtils.attach(c, scene, pivot) : pivot.attach(c);
        });

        const targetAngle = cfg.dir * (Math.PI / 2);
        const startAngle = 0;
        let startTime = null;

        function frame(time) {
          if (!startTime) startTime = time;
          const elapsed = time - startTime;
          let progress = Math.min(elapsed / durationMs, 1);
          let eased = easeInOutCubic(progress);

          pivot.rotation[cfg.axis] = startAngle + (targetAngle - startAngle) * eased;

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            pivot.updateMatrixWorld();
            targetCubies.forEach(c => {
              scene.attach(c);
              c.userData.lx = Math.round(c.position.x / spacing);
              c.userData.ly = Math.round(c.position.y / spacing);
              c.userData.lz = Math.round(c.position.z / spacing);
            });
            scene.remove(pivot);
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    async function playMovesSequentially(moves, durationMs, statusLabel = null) {
      const pContainer = document.getElementById('progress-container');
      const pBar = document.getElementById('progress-bar');
      const sContainer = document.getElementById('spinner-container');

      if (statusLabel) {
        pContainer.style.display = 'block';
        sContainer.style.display = 'none';
      }

      for (let i = 0; i < moves.length; i++) {
        if (statusLabel) {
          statusLabel.innerText = `Bước ${i + 1}/${moves.length}: ${moves[i]}`;
          pBar.style.width = `${((i + 1) / moves.length) * 100}%`;
        }
        await animateMoveAsync(moves[i], durationMs);
        await new Promise(r => setTimeout(r, 100)); // Khoảng nghỉ 100ms
      }

      if (statusLabel) {
        setTimeout(() => {
          document.getElementById('status-banner').style.display = 'none';
        }, 500); // Ẩn banner sau khi hoàn thành 0.5s
      }
    }

    // --- RENDER LOOP ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // --- STATE MANAGEMENT ---
    let currentCubeState = null; // Trạng thái logic từ backend
    let currentScrambleMoves = []; // Các bước để render tức thì
    let isScrambled = false;

    function applyMoveInstant(moveStr) {
      const cfg = MOVE_MAP[moveStr];
      if (!cfg) return;
      const targetCubies = cubies.filter(c => Math.round(c.userData[cfg.layer]) === cfg.val);
      if (targetCubies.length === 0) return;
      
      const pivot = new THREE.Group();
      scene.add(pivot);
      targetCubies.forEach(c => {
        c.updateMatrixWorld();
        THREE.SceneUtils && THREE.SceneUtils.attach ? THREE.SceneUtils.attach(c, scene, pivot) : pivot.attach(c);
      });
      
      pivot.rotation[cfg.axis] = cfg.dir * (Math.PI / 2);
      pivot.updateMatrixWorld();
      
      targetCubies.forEach(c => {
        scene.attach(c);
        c.userData.lx = Math.round(c.position.x / spacing);
        c.userData.ly = Math.round(c.position.y / spacing);
        c.userData.lz = Math.round(c.position.z / spacing);
      });
      scene.remove(pivot);
    }

    function renderCubeFromState() {
      // 1. Luôn Reset về Goal
      cubies.forEach(c => {
        c.position.set(c.userData.initX, c.userData.initY, c.userData.initZ);
        c.rotation.set(0, 0, 0);
        c.updateMatrixWorld();
        c.userData.lx = Math.round(c.userData.initX / spacing);
        c.userData.ly = Math.round(c.userData.initY / spacing);
        c.userData.lz = Math.round(c.userData.initZ / spacing);
      });
      // 2. Apply trạng thái nếu có
      if (isScrambled && currentScrambleMoves.length > 0) {
        currentScrambleMoves.forEach(m => applyMoveInstant(m));
      }
    }

    // --- UI TƯƠNG TÁC GỌI API ---
    const btnScramble = document.getElementById('btn-scramble');
    const btnSolve = document.getElementById('btn-solve');
    const banner = document.getElementById('status-banner');
    const statusText = document.getElementById('status-text');
    const sContainer = document.getElementById('spinner-container');
    const pContainer = document.getElementById('progress-container');
    const selHeuristic = document.getElementById('sel-heuristic');
    const inpScrambleMoves = document.getElementById('inp-scramble-moves');
    const warnHeuristic = document.getElementById('warn-heuristic');

    inpScrambleMoves.value = Math.floor(Math.random() * 8) + 5;

    function checkWarning() {
      const isV1 = selHeuristic.value === 'v1';
      const isLong = parseInt(inpScrambleMoves.value) > 8;
      warnHeuristic.style.display = (isV1 && isLong) ? 'block' : 'none';
    }
    
    selHeuristic.addEventListener('change', checkWarning);
    inpScrambleMoves.addEventListener('input', checkWarning);
    checkWarning();

    function setUIDisabled(disabled) {
      btnScramble.disabled = disabled;
      btnSolve.disabled = disabled;
      selHeuristic.disabled = disabled;
      inpScrambleMoves.disabled = disabled;
    }

    btnScramble.addEventListener('click', async () => {
      setUIDisabled(true);

      banner.style.display = 'block';
      sContainer.style.display = 'block';
      pContainer.style.display = 'none';
      statusText.innerText = "ĐANG TẠO XÁO TRỘN...";

      try {
        const nMoves = parseInt(inpScrambleMoves.value) || 10;
        const res = await fetch(`http://127.0.0.1:8000/scramble?n=${nMoves}`);
        const data = await res.json();
        
        // Reset 3D (không gán state ngay mà render về gốc trước khi play moves)
        isScrambled = false; 
        currentCubeState = null;
        currentScrambleMoves = [];
        renderCubeFromState(); 

        document.getElementById('stat-len').innerText = "-";
        document.getElementById('stat-node').innerText = "-";
        document.getElementById('stat-time').innerText = "-";

        await playMovesSequentially(data.moves, 150, statusText);
        
        // Cập nhật "nguồn sự thật" sau khi animate xong
        currentCubeState = data.state;
        currentScrambleMoves = data.moves;
        isScrambled = true;

        setUIDisabled(false);
      } catch (err) {
        banner.style.display = 'none';
        alert("Lỗi gọi API Scramble! " + err);
        setUIDisabled(false);
      }
    });

    btnSolve.addEventListener('click', async () => {
      if (!isScrambled || !currentCubeState) return alert("Vui lòng xáo trộn khối Rubik trước!");

      setUIDisabled(true);
      banner.style.display = 'block';
      sContainer.style.display = 'block';
      pContainer.style.display = 'none';
      statusText.innerText = "AI ĐANG TÍNH TOÁN LỜI GIẢI...";

      const heuristic = selHeuristic.value;

      try {
        const res = await fetch('http://127.0.0.1:8000/solve', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state: currentCubeState, heuristic: heuristic })
        });
        const data = await res.json();

        if (data.moves === null) {
          banner.style.display = 'none';
          alert("Lỗi TIMEOUT: Heuristic thô không giải được trong giới hạn, thử heuristic v2 hoặc scramble ít bước hơn.");
          
          // Đảm bảo khối không lệch, KHÔNG đổi isScrambled và currentCubeState
          renderCubeFromState();
          
          setUIDisabled(false);
          return;
        }

        document.getElementById('stat-len').innerText = data.moves.length + " bước";
        document.getElementById('stat-node').innerText = data.nodes_opened.toLocaleString();
        document.getElementById('stat-time').innerText = data.time_ms + " ms";

        await playMovesSequentially(data.moves, 350, statusText);

        // Giải xong thành công
        currentCubeState = null;
        currentScrambleMoves = [];
        isScrambled = false;

        setUIDisabled(false);

      } catch (err) {
        banner.style.display = 'none';
        alert("Lỗi gọi API Solve! " + err);
        setUIDisabled(false);
      }
    });
  </script>
</body>

</html>
